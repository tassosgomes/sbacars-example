name: CI

# §9 do plano de fundação: o gate deterministico (scripts/ai-flow/gate.sh) cobre backend e
# frontend e roda aqui em todo push/PR para main. Sem publicação de imagem nem deploy — isso é
# Fase D (D1-D4).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest já vem com o Docker Engine pronto, exigido pelos testes de integração com
      # Testcontainers (postgres:18) — SbaCars.Persistence.IntegrationTests,
      # SbaCars.Gateway.Tests e SbaCars.BuildingBlocks.Web.Tests.
      - name: Docker version (Testcontainers precisa do daemon disponível)
        run: docker version

      # Versão fixada, coerente com backend/Directory.Build.props (TargetFramework net10.0) e
      # backend/.config/dotnet-tools.json (dotnet-ef 10.0.11).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Versão fixada numa LTS acima do mínimo declarado em package.json (engines.node >=20).
      # Não espelha a versão da máquina de nenhum desenvolvedor de propósito: o que o gate precisa
      # garantir é que o build passa numa versão suportada e estável, não que reproduz o ambiente
      # local de quem abriu o PR.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore backend dependencies
        run: dotnet restore backend/SbaCars.sln

      # Modo full (sem --filter): format/build/testes cobrindo o repositório inteiro, backend e
      # frontend — ver o cabeçalho de scripts/ai-flow/gate.sh para a justificativa de por que o
      # modo padrão aqui é "completo" e não um diff de task.
      - name: Run gate
        run: scripts/ai-flow/gate.sh
