services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sbacars
    ports:
      - "5432:5432"
    volumes:
      - sbacars-postgres-data:/var/lib/postgresql
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A5 — banco dedicado do Logto (§5.1). Roda como job (não como script de entrypoint do
  # `postgres`, que pertence ao Migrator dos serviços .NET em backend/docker/postgres/init/):
  # cria a role e o banco "logto" na mesma instância, e sai. Idempotente — reexecuta a cada
  # `docker compose up` sem erro.
  logto-db-init:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./infra/logto/db-init.sql:/db-init.sql:ro
    entrypoint:
      ["psql", "-h", "postgres", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/db-init.sql"]
    restart: "no"

  # Seed do schema interno do Logto (tabelas, config default) — precisa rodar antes do servidor
  # subir. `--swe` (skip-when-exists) é a flag oficial do `@logto/cli` para tornar o comando
  # idempotente: se a tabela de config já existe, o seed é pulado em vez de tentar recriar.
  logto-seed:
    image: node:22-alpine
    depends_on:
      logto-db-init:
        condition: service_completed_successfully
    environment:
      DB_URL: postgres://logto:logto_dev_pw@postgres:5432/logto
    entrypoint: ["sh", "-c"]
    command: ["npx --yes @logto/cli@1.42.0 db seed --swe --db-url \"$$DB_URL\""]
    restart: "no"

  # A5 — Logto como IdP único (§5.0). Tag fixa (nunca `latest`, ver §5.1) — estado em Postgres,
  # sem volume de container: `docker compose down` seguido de `up` não perde nada porque o banco
  # `logto` (acima) já persiste no volume `sbacars-postgres-data`.
  #
  # ENDPOINT=http://localhost:3001 é a decisão registrada para A6: o issuer do token é o
  # localhost, resolvível pelo navegador sem editar /etc/hosts. Os serviços em container da A6
  # devem separar `MetadataAddress` (http://logto:3001/oidc/...) de `ValidIssuer`
  # (http://localhost:3001/oidc) na config do JwtBearer — ver §5.1 da task A5 e a "Armadilha de
  # rede" do plano de fundação.
  logto:
    image: ghcr.io/logto-io/logto:1.42.0
    depends_on:
      logto-seed:
        condition: service_completed_successfully
    environment:
      TRUST_PROXY_HEADER: "1"
      ENDPOINT: http://localhost:3001
      ADMIN_ENDPOINT: http://localhost:3002
      DB_URL: postgres://logto:logto_dev_pw@postgres:5432/logto
    ports:
      - "3001:3001"
      - "3002:3002"

  # B1 — RabbitMQ como broker de mensageria local (§6, §6.3.1): a mesma topologia usada em
  # produção (Rebus sobre AMQP), só que sem TLS de propósito — a diferença para o `amqps://` de um
  # CloudAMQP gerenciado é só configuração da connection string, não código (ver
  # MessagingOptionsValidator, que já rejeita `amqps://` com validação de certificado desligada).
  # Imagem `-management` (não a "plain"): o painel de filas/exchanges/bindings em localhost:15672
  # é o jeito de inspecionar a topologia declarada por AddSbaCarsMessaging (exchanges
  # sbacars.direct/sbacars.events, filas por serviço) sem ferramenta adicional nenhuma. Volume
  # porque fila durável e mensagem persistente (o que Rebus.RabbitMq declara por padrão) perderiam
  # sentido se um `docker compose down && up` apagasse tudo.
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sbacars
      RABBITMQ_DEFAULT_PASS: sbacars_dev_pw
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # painel de gestão
    volumes:
      - sbacars-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 12

  # A8 — Aspire Dashboard como coletor OTLP local (§8, §10): traces, métricas e logs
  # correlacionados dos seis processos .NET e do OpenTelemetry Web dos dois SPAs num único lugar,
  # sem subir uma stack de observabilidade completa. Tag fixa (nunca `latest`, mesma disciplina do
  # Logto acima) — sem volume de container: o dashboard não persiste nada entre execuções, e não
  # precisa persistir (é um coletor/visualizador, não uma fonte de verdade).
  #
  # Postura de auth em ambiente local: os dois AUTHMODE ficam Unsecured. O modo padrão do
  # frontend exige um token de navegador (BrowserToken) e o do OTLP exige API key — nenhum dos
  # dois agrega segurança real num ambiente que já não é exposto fora do host do desenvolvedor, e
  # exigiriam distribuir uma chave para os seis processos .NET (que enviam via OTLP/gRPC) e para os
  # dois SPAs (que enviam via OTLP/HTTP direto do navegador, onde a chave ficaria visível de
  # qualquer forma). Não é a postura de produção — quando este ambiente existir, o dashboard nem
  # roda fora do cluster.
  #
  # Duas portas OTLP, não uma: os seis processos .NET exportam por gRPC (18889); os dois SPAs
  # exportam por HTTP (18890), porque é o que o SDK OpenTelemetry Web suporta no navegador. CORS
  # liberado nas origens dos dois SPAs — sem isso, o navegador bloqueia a chamada cross-origin do
  # exportador antes mesmo dela sair.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    environment:
      ASPNETCORE_URLS: http://+:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://+:18890
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      DASHBOARD__OTLP__CORS__ALLOWEDORIGINS: http://localhost:5173,http://localhost:5174
      DASHBOARD__OTLP__CORS__ALLOWEDHEADERS: content-type,traceparent,tracestate
    ports:
      - "18888:18888"
      - "18889:18889"
      - "18890:18890"

volumes:
  sbacars-postgres-data:
  sbacars-rabbitmq-data:
